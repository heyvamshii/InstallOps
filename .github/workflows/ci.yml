name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest

    # The suite has only ever been verified against SQLite locally; CI runs it against
    # PostgreSQL, which is what production uses.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: installops
          POSTGRES_PASSWORD: installops
          POSTGRES_DB: installops
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: 'True'
      # Long enough to satisfy the deployment check; CI-only, never used anywhere real.
      SECRET_KEY: ci-only-value-not-a-real-secret-3f9a1c7e2b8d4a6f5e0c9b7d1a3f5e7c
      DATABASE_URL: postgresql://installops:installops@localhost:5432/installops
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Django deployment checks
        working-directory: backend
        env:
          DEBUG: 'False'
          ALLOWED_HOSTS: installops.example.com
        run: python manage.py check --deploy --fail-level WARNING

      - name: Tests
        working-directory: backend
        run: pytest --cov=apps --cov-report=term-missing

  frontend:
    name: Frontend — build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        working-directory: frontend
        run: npx ng test --watch=false

      - name: Production build
        working-directory: frontend
        run: npx ng build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: installops
          POSTGRES_PASSWORD: installops
          POSTGRES_DB: installops
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: 'True'
      # Long enough to satisfy the deployment check; CI-only, never used anywhere real.
      SECRET_KEY: ci-only-value-not-a-real-secret-3f9a1c7e2b8d4a6f5e0c9b7d1a3f5e7c
      DATABASE_URL: postgresql://installops:installops@localhost:5432/installops
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:4200

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Migrate and seed
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo --flush

      - name: Start API
        working-directory: backend
        run: |
          python manage.py runserver 8000 --noreload &
          npx --yes wait-on http://localhost:8000/health/ --timeout 60000

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end suite
        working-directory: frontend
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
